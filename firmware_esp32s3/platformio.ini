[env:esp32-s3-n16r8]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CE5226325-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5CE5226325-if00
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -I include
    -O2
lib_deps =
build_src_filter =
    +<*>

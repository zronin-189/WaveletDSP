[platformio]
src_dir = device
default_envs = esp32-s3-dsp-test
extra_configs = ../platformio.ini

[env:esp32-s3-dsp-test]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<main.cpp>
    +<dsp_source.c>
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -I ../include

[env:esp32-s3-audio-diagnostic]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<audio_diagnostic.cpp>
    +<audio_i2s_source.cpp>
    +<audio_stream_source.c>
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -I ../include

[env:esp32-s3-audio-tx-only]
extends = env:esp32-s3-audio-diagnostic
build_src_filter =
    -<*>
    +<audio_diagnostic.cpp>
    +<audio_tx_only.cpp>
    +<audio_stream_source.c>
build_flags =
    ${env:esp32-s3-audio-diagnostic.build_flags}
    -DAUDIO_DIAGNOSTIC_TX_ONLY=1

[env:esp32-s3-mic-standalone]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<mic_standalone.cpp>

[env:esp32-s3-speaker-standalone]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<speaker_standalone.cpp>
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -I ../include
